services:
  - type: web
    name: retoperxia-registro-proveedor
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm install --prefix web --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MAX_AGENT_ITERATIONS
        value: "15"
      - key: MAX_SESSION_TOKENS
        value: "50000"
      - key: MAX_GLOBAL_TOKENS
        value: "200000"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "30"
      - key: MAX_CONCURRENT_GEMINI_CALLS
        value: "2"
      - key: ALLOW_REFERENCE_DATE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_ACCESS_KEY
        sync: false
